<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#000000">
  <meta name="description" content="Providence Artificial Intelligence and Robotics Lab at Providence College. Our new website is coming soon.">
  <title>PAIR Lab | Providence College</title>
  <link rel="icon" type="image/png" href="./assets/pair-logo-black.png">
  <style>
    :root { color-scheme: dark; font-family: Arial, Helvetica, sans-serif; color: #fff; background: #000; }
    * { box-sizing: border-box; }
    body { margin: 0; }
    .page { width: min(860px, calc(100% - 48px)); margin: 0 auto; min-height: 100vh; min-height: 100svh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 56px 0; text-align: center; }
    header { width: 100%; margin-bottom: 44px; }
    .wordmark { display: block; width: min(700px, 100%); height: auto; margin: 0 auto; filter: invert(1); }
    main { width: 100%; }
    .eyebrow { margin: 0 0 18px; font-size: .875rem; line-height: 1.5; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; }
    h1 { overflow-wrap: anywhere; margin: 0 0 24px; font-size: clamp(3rem, 6.4vw, 4.75rem); line-height: 1.08; letter-spacing: -.045em; font-weight: 600; }
    .intro { max-width: 580px; margin: 0 auto; font-size: 1.125rem; line-height: 1.75; }
    .affiliation { margin: 26px 0 0; font-size: 1rem; line-height: 1.6; font-weight: 600; }
    footer { width: 100%; margin-top: 48px; font-size: .875rem; line-height: 1.8; }
    footer p { margin: 0; }
    @media (max-width: 600px) {
      .page { width: calc(100% - 40px); padding: 40px 0; }
      header { margin-bottom: 32px; }
      h1 { font-size: clamp(2.6rem, 10vw, 3.5rem); }
      .intro { font-size: 1rem; }
      footer { margin-top: 36px; }
    }
  </style>
</head>
<body>
  <div class="page">
    <header>
      <img class="wordmark" src="./assets/pair-logo-black.png" width="2048" height="757" alt="PAIR — Providence Artificial Intelligence and Robotics Lab">
    </header>
    <main>
      <section aria-labelledby="coming-soon">
        <p class="eyebrow">Our new website</p>
        <h1 id="coming-soon">Coming soon.</h1>
        <p class="intro">We’re building a new home for our research, projects, and student work in artificial intelligence and robotics.</p>
        <p class="affiliation">PAIR Lab at Providence College</p>
      </section>
    </main>
    <footer>
      <p>Providence College · Providence, Rhode Island</p>
      <p>Artificial intelligence · Robotics · Undergraduate research</p>
    </footer>
  </div>
</body>
</html>
